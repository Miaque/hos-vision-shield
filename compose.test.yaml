services:
  cuda-mps:
    image: vision-shield-test:cu130
    init: true
    restart: unless-stopped
    user: "10001:10001"
    group_add:
      - "1022"
    network_mode: none
    ipc: shareable
    environment:
      CUDA_VISIBLE_DEVICES: ${GPU_DEVICE_ID:?请指定一张 GPU 的卡号或完整 UUID}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CUDA_MPS_PIPE_DIRECTORY: /data/runtime/cuda-mps/pipe
      CUDA_MPS_LOG_DIRECTORY: /data/runtime/cuda-mps/log
    command:
      - /bin/sh
      - -ec
      - >-
        mkdir -p /data/runtime/cuda-mps/pipe /data/runtime/cuda-mps/log;
        chmod 700 /data/runtime/cuda-mps /data/runtime/cuda-mps/pipe /data/runtime/cuda-mps/log;
        exec /usr/bin/nvidia-cuda-mps-control -f
    volumes:
      - type: bind
        source: ${MEDIA_DIR:?请设置已准备且可写的媒体绝对目录}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /usr/bin/nvidia-cuda-mps-control
        target: /usr/bin/nvidia-cuda-mps-control
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /usr/bin/nvidia-cuda-mps-server
        target: /usr/bin/nvidia-cuda-mps-server
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
    healthcheck:
      test: [CMD-SHELL, "echo get_server_list | nvidia-cuda-mps-control"]
      interval: 5s
      timeout: 3s
      retries: 3
  mediamtx:
    image: vision-shield-test:mediamtx-rtp-info
    build:
      context: .
      dockerfile: deploy/Dockerfile.mediamtx-test
    environment:
      MTX_PATHDEFAULTS_USEABSOLUTETIMESTAMP: "true"
  api:
    image: vision-shield-test:cpu
    build:
      target: rtsp-test
  reconciler:
    image: vision-shield-test:cpu
    build:
      target: rtsp-test
  notifier:
    image: vision-shield-test:cpu
    build:
      target: rtsp-test
  file-worker:
    image: vision-shield-test:cu130
    build:
      target: rtsp-test
      args:
        TORCH_BACKEND: cu130
    group_add:
      - "1022"
  stream-worker:
    image: vision-shield-test:cu130
    pid: service:cuda-mps
    ipc: service:cuda-mps
    depends_on:
      cuda-mps:
        condition: service_healthy
    build:
      target: rtsp-test
      args:
        TORCH_BACKEND: cu130
    environment:
      CUDA_VISIBLE_DEVICES: ${GPU_DEVICE_ID:?请指定一张 GPU 的卡号或完整 UUID}
      CUDA_MPS_PIPE_DIRECTORY: /data/runtime/cuda-mps/pipe
      CUDA_MPS_LOG_DIRECTORY: /data/runtime/cuda-mps/log
    group_add:
      - "1022"
    deploy:
      resources:
        reservations:
          # shortcut: NVIDIA 580 单卡容器硬解失败，驱动修复后恢复单卡映射。
          devices: !override
            - driver: nvidia
              capabilities: [gpu]
              count: all
