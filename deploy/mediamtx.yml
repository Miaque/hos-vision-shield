# Local media plane: callers read anonymously; worker generations own publishing.
logLevel: warn
api: yes
apiAddress: 127.0.0.1:9997
rtsp: yes
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: no
hls: no
webrtc: no
srt: no
moq: no
authMethod: http
authHTTPAddress: http://127.0.0.1:8000/internal/media/publish-check
authHTTPExclude:
  - action: read
  - action: api
pathDefaults:
  source: publisher
  overridePublisher: no
  record: no
paths:
  all_others:
