# 本机媒体平面：RTSP 内部读取，HLS 仅受信 CDN 代理，推流由 worker 代次鉴权。
logLevel: warn
api: yes
apiAddress: 127.0.0.1:9997
rtsp: yes
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: no
hls: yes
hlsAddress: 127.0.0.1:8888
hlsAlwaysRemux: no
hlsMuxerCloseAfter: 60s
# 本地运行时通过 MTX_HLSCDNSECRET 注入，与 Platform 内部代理配置一致。
webrtc: no
srt: no
moq: no
authMethod: http
authHTTPAddress: http://127.0.0.1:8000/internal/media/publish-check
authHTTPExclude:
  - action: api
pathDefaults:
  source: publisher
  overridePublisher: no
  record: no
paths:
  all_others:
