services:
  file-worker:
    image: vision-shield:cu126
    build:
      args:
        TORCH_BACKEND: cu126
    environment:
      DETECTION_BACKEND: quality_yolo
      INFERENCE_DEVICE: cuda
      GPU_DEVICE_ID: ${GPU_DEVICE_ID:?请指定一张 GPU 的卡号或完整 UUID}
    deploy:
      replicas: 2
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["${GPU_DEVICE_ID:?请指定一张 GPU 的卡号或完整 UUID}"]

  stream-worker:
    image: vision-shield:cu126
    build:
      args:
        TORCH_BACKEND: cu126
    environment:
      DETECTION_BACKEND: quality_yolo
      INFERENCE_DEVICE: cuda
      GPU_DEVICE_ID: ${GPU_DEVICE_ID:?请指定一张 GPU 的卡号或完整 UUID}
    deploy:
      replicas: 2
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["${GPU_DEVICE_ID:?请指定一张 GPU 的卡号或完整 UUID}"]
